pipeline:
  name: RollingDeploy
  identifier: RollingDeploy
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: d
        identifier: d
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: ShellScript_1
                  identifier: ShellScript_1
                  spec:
                    shell: Bash
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo 'written before failing' > "$UDEPLOY_ARTIFACTS/partial.txt"
                          exit 3
                    environmentVariables: []
                    outputVariables: []
                  timeout: 10m
        tags: {}
  flowControl:
    barriers:
      - name: k
        identifier: k
  notificationRules:
    - name: "n"
      identifier: "n"
      pipelineEvents:
        - type: AllEvents
      notificationMethod:
        type: Email
        spec:
          userGroups: []
          recipients:
            - ys@yabi.dev
      enabled: true
